<style>
  .docs-layout {
    display: grid;
    grid-template-columns: 15rem 1fr;
    gap: var(--ncss-space-xl);
    align-items: start;
  }
  /* Grid-Items schrumpfen ohne dies nicht unter ihre Inhaltsbreite (derselbe Fallstrick
     wie bei flex), sprengt sonst die eigene Spalte bei langen Code-Zeilen/Tabellen. */
  .docs-layout > * {
    min-width: 0;
  }
  .docs-sidebar {
    position: sticky;
    top: calc(var(--ncss-topbar-height) + var(--ncss-space-md));
    max-height: calc(100svh - var(--ncss-topbar-height) - 2 * var(--ncss-space-md));
    overflow-y: auto;
  }
  .docs-sidebar-group + .docs-sidebar-group {
    margin-block-start: var(--ncss-space-md);
  }
  .docs-sidebar-group-title {
    font-size: var(--ncss-font-size-sm);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ncss-color-text-muted);
    padding-inline: var(--ncss-space-xs);
    margin-block-end: var(--ncss-space-3xs);
  }
  @media (max-width: 59.99rem) {
    .docs-layout {
      grid-template-columns: 1fr;
    }
    .docs-sidebar {
      position: static;
      max-height: none;
    }
  }
  /* Sidebar auf Mobile hinter einem <details>/<summary>-Umschalter statt IMMER voll
     aufgeklappt vor dem eigentlichen Seiteninhalt zu stehen (User-Report: "Handbuch navi
     ist mobil immer voll aufgeklappt", per Screenshot bestätigt - alle Nav-Gruppen
     nahmen den kompletten ersten Bildschirm ein, bevor überhaupt Seiteninhalt kam).
     .ncss-nav-dropdown liefert Chevron/Hover/Fokus-Optik bereits fertig (siehe
     components/nav.css) - hier nur die responsive Sichtbarkeit des Umschalters selbst.
     Erster Versuch: <details> OHNE open-Attribut im Markup lassen, stattdessen
     .docs-sidebar { display:block !important } ab 60rem erzwingen, um den Inhalt trotz
     geschlossenem <details> sichtbar zu machen - per echtem Test verworfen: moderne
     Browser rendern den Inhalt eines GESCHLOSSENEN <details> über einen internen Slot-
     Mechanismus (nicht nur simples display:none), ein via Kind-Selektor erzwungenes
     display:block gewinnt zwar in getComputedStyle/getBoundingClientRect (Layout läuft
     normal), das Element wird aber trotzdem nicht GEMALT (Screenshot blieb leer, obwohl
     alle Werte "sichtbar" meldeten) - dieselbe Kind-Display-Override-Masche, die früher
     zuverlässig funktionierte, greift hier nicht mehr. Fix: das ECHTE open-Attribut
     verwenden statt es per CSS vorzutäuschen - im Markup PER DEFAULT gesetzt (JS-lose
     Besucher/Bots sehen die Sidebar dadurch immer offen, wie vor diesem Fix - sicherer
     Fallback statt sie ihnen komplett zu verstecken), ein winziges synchrones Inline-
     Script (im <details> selbst, läuft vor dem ersten Paint) entfernt es wieder, wenn
     der Viewport beim Laden schmaler als 60rem ist. */
  .docs-sidebar-summary {
    display: none;
  }
  @media (max-width: 59.99rem) {
    .docs-sidebar-summary {
      display: flex;
      justify-content: space-between;
      border: var(--ncss-border-width) solid var(--ncss-color-border);
      border-radius: var(--ncss-radius-md);
      padding: var(--ncss-space-sm) var(--ncss-space-md);
      margin-block-end: var(--ncss-space-md);
      font-weight: 700;
    }
  }
  .docs-prevnext {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--ncss-space-md);
    margin-block-start: var(--ncss-space-xl);
    padding-block-start: var(--ncss-space-lg);
    border-block-start: 1px solid var(--ncss-color-border);
  }
  .docs-prevnext-next {
    text-align: end;
  }
  .docs-prevnext-label {
    display: block;
    font-size: var(--ncss-font-size-sm);
    color: var(--ncss-color-text-muted);
  }
  /* Aktive-Seite-Optik für die Sidebar UND die Topbar kommt jetzt aus components/nav.css
     selbst ([aria-current="page"], allgemein für jede .ncss-nav-Variante) - kein
     Seiten-lokales CSS mehr nötig. Nur die Sprachumschalter-Markierung (eigener
     Attributwert "true", kein Seiten-Konzept von ncss selbst) bleibt hier lokal. */
  .ncss-nav-item a[aria-current="true"] {
    font-weight: 700;
    text-decoration: underline;
  }
  section[id] {
    scroll-margin-top: calc(var(--ncss-topbar-height) + var(--ncss-space-sm));
  }
  .docs-footer-brand {
    color: var(--ncss-color-text);
  }
</style>
