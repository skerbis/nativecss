<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration: ein Kreis halb hell mit Sonne, halb dunkel mit Mond und Sternen, symbolisiert light-dark()">
  <defs>
    <linearGradient id="ld-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#bcd8ff"/>
    </linearGradient>
    <linearGradient id="ld-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2138"/>
      <stop offset="1" stop-color="#02060e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#121212"/>
  <rect width="400" height="600" fill="url(#ld-light)"/>
  <rect x="400" width="400" height="600" fill="url(#ld-dark)"/>

  <!-- Sonne -->
  <g transform="translate(200,260)">
    <circle r="70" fill="#ffb84d"/>
    <g stroke="#ffb84d" stroke-width="8" stroke-linecap="round">
      <line x1="0" y1="-108" x2="0" y2="-130"/>
      <line x1="0" y1="108" x2="0" y2="130"/>
      <line x1="-108" y1="0" x2="-130" y2="0"/>
      <line x1="108" y1="0" x2="130" y2="0"/>
      <line x1="76" y1="-76" x2="92" y2="-92"/>
      <line x1="-76" y1="-76" x2="-92" y2="-92"/>
      <line x1="76" y1="76" x2="92" y2="92"/>
      <line x1="-76" y1="76" x2="-92" y2="92"/>
    </g>
  </g>

  <!-- Mond + Sterne -->
  <g transform="translate(600,260)">
    <path d="M40 -70 A72 72 0 1 0 40 70 A58 58 0 1 1 40 -70 Z" fill="#f0f2f8"/>
    <circle cx="-90" cy="-100" r="4" fill="#ffffff"/>
    <circle cx="-60" cy="-140" r="3" fill="#ffffff"/>
    <circle cx="-130" cy="-40" r="3" fill="#ffffff"/>
    <circle cx="-110" cy="110" r="4" fill="#ffffff"/>
    <circle cx="-40" cy="150" r="3" fill="#ffffff"/>
  </g>

  <line x1="400" y1="0" x2="400" y2="600" stroke="#ffffff" stroke-width="2" opacity="0.35"/>

  <text x="200" y="540" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" fill="#1a1a1a" opacity="0.85">light</text>
  <text x="600" y="540" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" fill="#ffffff" opacity="0.85">dark</text>
</svg>
