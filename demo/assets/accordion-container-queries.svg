<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration: zwei Container unterschiedlicher Breite, derselbe Kartenaufbau passt sich jeweils per Container Query an">
  <defs>
    <linearGradient id="cq-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0057d8"/>
      <stop offset="1" stop-color="#00308a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cq-bg)"/>

  <!-- schmaler Container: Karte gestapelt -->
  <g transform="translate(70,140)">
    <rect x="0" y="0" width="240" height="330" rx="14" fill="#ffffff" opacity="0.12"/>
    <rect x="0" y="0" width="240" height="330" rx="14" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
    <rect x="22" y="24" width="196" height="120" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="22" y="160" width="196" height="16" rx="4" fill="#ffffff" opacity="0.85"/>
    <rect x="22" y="186" width="140" height="12" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="22" y="206" width="160" height="12" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="22" y="238" width="90" height="30" rx="8" fill="#6ea8ff"/>
  </g>

  <!-- Pfeil / Größenänderung -->
  <g transform="translate(345,290)" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.85">
    <path d="M0 0 L90 0" stroke-linecap="round"/>
    <path d="M70 -14 L90 0 L70 14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- breiter Container: Karte nebeneinander -->
  <g transform="translate(470,180)">
    <rect x="0" y="0" width="260" height="240" rx="14" fill="#ffffff" opacity="0.12"/>
    <rect x="0" y="0" width="260" height="240" rx="14" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>
    <rect x="20" y="20" width="100" height="200" rx="8" fill="#ffffff" opacity="0.9"/>
    <rect x="134" y="24" width="106" height="14" rx="4" fill="#ffffff" opacity="0.85"/>
    <rect x="134" y="48" width="86" height="10" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="134" y="64" width="96" height="10" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="134" y="88" width="106" height="10" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="134" y="112" width="70" height="26" rx="8" fill="#6ea8ff"/>
  </g>

  <text x="400" y="540" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" fill="#ffffff" opacity="0.9">Container Queries</text>
</svg>
